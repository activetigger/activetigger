name: Check code sanity
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  check-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Lint chart
        run: helm lint charts/activetigger --strict

      - name: Render and validate manifests
        run: |
          set -e
          validate() {
            echo "== helm template $*"
            helm template test charts/activetigger "$@" \
              | kubeconform -strict -summary -kubernetes-version 1.29.0
          }
          validate
          validate --set secrets.create=false --set secrets.existingSecret=at-secret
          validate --set api.gpu.enabled=true --set api.env.CPU_ONLY=false
          validate --set postgresql.enabled=false
          validate --set api.persistence.enabled=false --set postgresql.persistence.enabled=false

      - name: Check missing-secret guard fails
        run: |
          if helm template test charts/activetigger --set secrets.create=false > /dev/null 2>&1; then
            echo "ERROR: rendering should fail when secrets.create=false and no existingSecret is set"
            exit 1
          fi
          echo "guard OK"

  check-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: make ci

      - name: code format check
        run: make format

      - name: lint check
        run: make lint

      - name: type check
        run: make typecheck

      - name: run tests
        run: make test-coverage

  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: "node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
