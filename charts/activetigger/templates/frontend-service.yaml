apiVersion: v1
kind: Service
metadata:
  name: {{ include "activetigger.frontendServiceName" . }}
  labels:
    {{- include "activetigger.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "activetigger.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
